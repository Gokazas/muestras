<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gokazas · Presentación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111214;--panel:#1A1C1F;--line:#2C2F34;--text:#ECEAE5;--muted:#9A9DA2;--accent:#F2C38B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 15px/1.4 "Manrope",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,a{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.02em;margin-right:6px;text-decoration:none}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:none;padding:0 14px;min-height:44px;cursor:pointer;border-radius:999px;color:var(--muted);white-space:nowrap}
.tab small{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:-2px}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode button{border:0;background:none;min-height:44px;padding:0 16px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:8px}
.mode button[aria-pressed="true"]{background:var(--accent);color:#111}
.mode svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.tools{display:flex;gap:6px}
.tool{border:1px solid var(--line);background:none;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;border-radius:999px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
.tool:hover{border-color:var(--muted)}
.stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;min-height:0}
.device{position:absolute;left:50%;top:50%;transform-origin:center center}
/* Móvil */
.phone{width:414px;height:868px;background:#0A0A0B;border-radius:58px;padding:12px;box-shadow:0 0 0 2px #2E3136,0 40px 80px rgba(0,0,0,.6)}
.phone .notch{position:absolute;left:50%;top:22px;width:110px;height:30px;margin-left:-55px;background:#0A0A0B;border-radius:20px;z-index:3}
.phone .scr{width:390px;height:844px;border-radius:46px;overflow:hidden;background:#fff;position:relative}
/* Ordenador */
.laptop{width:1440px}
.laptop .lid{background:#0A0A0B;border-radius:22px 22px 0 0;padding:18px 18px 22px;box-shadow:0 0 0 2px #2E3136}
.laptop .scr{width:1404px;height:878px;overflow:hidden;background:#fff;position:relative;border-radius:4px}
.laptop .base{height:34px;margin:0 -70px;background:linear-gradient(#3A3D42,#1C1E21);border-radius:0 0 26px 26px;position:relative}
.laptop .base::before{content:"";position:absolute;left:50%;top:0;width:220px;height:10px;margin-left:-110px;background:#141518;border-radius:0 0 12px 12px}
.wrap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
iframe{border:0;display:block;width:100%;height:100%}
.cap{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:.8rem;pointer-events:none}
/* QR */
.qr{position:fixed;inset:0;background:rgba(10,10,11,.86);display:none;place-items:center;z-index:20}
.qr.on{display:grid}
.qr-box{background:#fff;color:#111;padding:28px;border-radius:24px;text-align:center;max-width:340px}
.qr-box h2{margin:0 0 6px;font-size:1.3rem}
.qr-box p{margin:0 0 18px;color:#555}
#qrc{display:grid;place-items:center;min-height:220px}
#qrc img,#qrc canvas{width:220px;height:220px}
.qr-box .u{font-size:.75rem;color:#777;word-break:break-all;margin-top:14px}
.qr-box button{margin-top:16px;border:0;background:#111;color:#fff;padding:12px 22px;border-radius:999px;cursor:pointer}
@media (max-width:700px){.brand{display:none}.tool .t{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">Gokazas<span>.</span></a>
  <nav class="tabs" id="tabs" aria-label="Webs de muestra"></nav>
  <div class="mode" role="group" aria-label="Vista">
    <button type="button" data-mode="phone" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Móvil</button>
    <button type="button" data-mode="laptop" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>Ordenador</button>
  </div>
  <div class="tools">
    <button class="tool" type="button" id="qrBtn" title="Abrir las webs en tu móvil"><span aria-hidden="true">▦</span><span class="t">En tu móvil</span></button>
    <a class="tool" id="openBtn" href="#" target="_blank" rel="noopener" title="Abrir a pantalla completa"><span aria-hidden="true">↗</span><span class="t">Abrir</span></a>
    <button class="tool" type="button" id="fsBtn" title="Pantalla completa" hidden>⛶</button>
  </div>
</header>
<main class="stage" id="stage">
  <div class="device" id="device"></div>
  <p class="cap" id="cap"></p>
</main>
<div class="qr" id="qr" role="dialog" aria-modal="true" aria-label="Código QR">
  <div class="qr-box"><h2>Míralas en tu móvil</h2><p>Apunta con la cámara a este código: se abren las cinco webs.</p><div id="qrc"></div><p class="u" id="qrUrl"></p><button type="button" id="qrClose">Cerrar</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var S=[['ventanal-cristaleria','Ventanal','Cristalería'],['marea-baja-taberna','Marea Baja','Taberna'],['nacar-peluqueria','Nácar','Peluquería'],['garaje41-taller','Garaje 41','Taller'],['voltio-electricistas','Voltio','Electricistas']];
  var q=new URLSearchParams(location.search),cur=Math.max(0,S.map(function(s){return s[0]}).indexOf(q.get('w'))),mode=q.get('v')==='ordenador'?'laptop':'phone';
  var tabs=document.getElementById('tabs'),dev=document.getElementById('device'),stage=document.getElementById('stage');
  tabs.innerHTML=S.map(function(s,i){return '<button class="tab" type="button" data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+s[1]+'<small>'+s[2]+'</small></button>'}).join('');
  function url(){return S[cur][0]+'/index.html'}
  function absUrl(){return new URL(url(),location.href).href}
  function build(){
    dev.className='device '+mode;
    dev.innerHTML=mode==='phone'?'<div class="notch"></div><div class="scr"><div class="wrap"><iframe title="'+S[cur][1]+' en móvil" src="'+url()+'"></iframe></div></div>'
      :'<div class="lid"><div class="scr"><div class="wrap"><iframe title="'+S[cur][1]+' en ordenador" src="'+url()+'"></iframe></div></div></div><div class="base"></div>';
    document.getElementById('openBtn').href=url();
    document.getElementById('cap').textContent=(mode==='phone'?'Vista móvil · 390 px':'Vista ordenador · 1404 px')+' · Desliza dentro de la pantalla';
    fit();
    try{history.replaceState(null,'','?w='+S[cur][0]+'&v='+(mode==='phone'?'movil':'ordenador'))}catch(e){}
  }
  function fit(){var w=dev.offsetWidth,h=dev.offsetHeight,sw=stage.clientWidth-24,sh=stage.clientHeight-24,k=Math.min(sw/w,sh/h,1);dev.style.transform='translate(-50%,-50%) scale('+k+')'}
  tabs.addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;cur=+b.dataset.i;Array.prototype.forEach.call(tabs.children,function(t){t.setAttribute('aria-pressed',t===b)});build()});
  Array.prototype.forEach.call(document.querySelectorAll('.mode button'),function(b){b.setAttribute('aria-pressed',b.dataset.mode===mode);b.addEventListener('click',function(){mode=b.dataset.mode;Array.prototype.forEach.call(document.querySelectorAll('.mode button'),function(x){x.setAttribute('aria-pressed',x===b)});build()})});
  addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,300)});
  var fs=document.getElementById('fsBtn'),de=document.documentElement;
  if(de.requestFullscreen||de.webkitRequestFullscreen){fs.hidden=false;fs.addEventListener('click',function(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}setTimeout(fit,300)})}
  var qr=document.getElementById('qr'),made='';
  document.getElementById('qrBtn').addEventListener('click',function(){var u=new URL('index.html',location.href).href;document.getElementById('qrUrl').textContent=u;
    if(made!==u){var box=document.getElementById('qrc');box.innerHTML='';if(window.QRCode){new QRCode(box,{text:u,width:440,height:440,correctLevel:QRCode.CorrectLevel.M})}else{box.textContent='Sin conexión: no se puede crear el código.'}made=u}
    qr.classList.add('on')});
  document.getElementById('qrClose').addEventListener('click',function(){qr.classList.remove('on')});
  qr.addEventListener('click',function(e){if(e.target===qr)qr.classList.remove('on')});
  build();
})();
</script>
</body>
</html>
